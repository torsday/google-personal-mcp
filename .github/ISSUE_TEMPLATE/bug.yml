name: Bug
description: Something isn't working
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? What were you expecting instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: "1. \n2. \n3. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, daemon version, transport (stdio/http), account count"
  - type: textarea
    id: adr-refs
    attributes:
      label: Relevant ADR(s)
      description: Which ADRs document the expected behavior?
      placeholder: "ADR-0004 (token refresh), ADR-0018 (untrusted content)"
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Relevant files, logs, stack traces. Tokens / secrets must NOT appear in logs (ADR-0017).
