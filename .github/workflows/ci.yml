name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features --locked --no-tests=warn

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features --locked

  systemd-unit:
    # Per #71 acceptance: lint the deploy/ systemd unit so a broken
    # template doesn't reach operators. Pinned to ubuntu-latest because
    # systemd-analyze isn't on macOS runners.
    name: systemd-analyze verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify deploy/google-personal-mcp.service
        run: |
          # `verify` resolves [Install]/[Service] directives; the binary
          # won't exist on the CI runner, so suppress that specific
          # warning and fail only on actual unit-file syntax errors.
          out=$(systemd-analyze verify deploy/google-personal-mcp.service 2>&1 || true)
          echo "$out"
          filtered=$(printf '%s\n' "$out" \
            | grep -v 'Command .* is not executable' \
            | grep -v 'does not exist' \
            | grep -v '^$' || true)
          if [ -n "$filtered" ]; then
            echo "::error::systemd-analyze flagged unexpected issues in the unit file"
            exit 1
          fi

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  macos:
    name: cargo test (macos-keychain)
    runs-on: [self-hosted, macos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: clippy (macos-keychain)
        run: cargo clippy --all-targets --features macos-keychain --locked -- -D warnings
      - name: test (macos-keychain)
        run: cargo nextest run --features macos-keychain --locked --no-tests=warn
