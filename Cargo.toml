[package]
name = "google-personal-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "A personal Google-services MCP daemon"
license = "MIT"
repository = "https://github.com/torsday/google-personal-mcp"
readme = "README.md"
keywords = ["mcp", "gmail", "google", "oauth2"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "google-personal-mcp"
path = "src/main.rs"

# ── Lints ─────────────────────────────────────────────────────────────────────

[lints.rust]
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

disallowed_methods = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "deny"

redundant_pub_crate = "allow"

[dependencies]
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "schemars"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "fs", "sync"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

reqwest = { version = "0.13", features = ["json", "charset", "http2", "blocking"] }

oauth2 = { version = "5" }

anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

base64 = "0.22"
dirs = "6"
open = "5"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
toml = "0.8"

mailparse = "0.16"
html2text = { version = "0.15", default-features = false }
encoding_rs = "0.8"

clap = { version = "4", features = ["derive"] }

shellexpand = "3"

[dev-dependencies]
tempfile = "3"
