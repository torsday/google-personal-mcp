[package]
name = "google-personal-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "A personal Google-services MCP daemon"
license = "MIT"
repository = "https://github.com/torsday/google-personal-mcp"
readme = "README.md"
keywords = ["mcp", "gmail", "google", "oauth2"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "google-personal-mcp"
path = "src/main.rs"

# Library target exists so `benches/*.rs` and future integration tests
# can import the crate's public API (e.g. `bench_parse_mime`). The bin
# `main.rs` is a thin shim that calls `lib::main_entry()`.
[lib]
name = "google_personal_mcp"
path = "src/lib.rs"

# ── Lints ─────────────────────────────────────────────────────────────────────

[lints.rust]
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

disallowed_methods = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "deny"

redundant_pub_crate = "allow"

[dependencies]
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }

# Streamable HTTP transport per ADR-0003 (#72). `axum` hosts the rmcp
# `StreamableHttpService` as a `tower` service; `tokio-util` supplies the
# `CancellationToken` used for graceful shutdown.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "fs", "sync", "signal"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

reqwest = { version = "0.13", features = ["json", "charset", "http2", "blocking"] }

oauth2 = { version = "5" }

anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Prometheus exporter — ADR-0008 §Metrics / issue #75.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

base64 = "0.22"
dirs = "6"
open = "5"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
toml = "1"

mailparse = "0.16"
html2text = { version = "0.17", default-features = false }
encoding_rs = "0.8"

clap = { version = "4", features = ["derive"] }

shellexpand = "3"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.3"
async-trait = "0.1"

keyring-core = { version = "1", optional = true }
apple-native-keyring-store = { version = "1", optional = true, features = ["keychain"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.7"

[features]
default = []
macos-keychain = ["dep:keyring-core", "dep:apple-native-keyring-store"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
insta = { version = "1", features = ["json"] }
# `test-util` gates `tokio::time::{pause, advance}` and the
# `start_paused` attribute on `#[tokio::test]` — used by the SessionStore
# sweeper tests to advance the clock deterministically.
tokio = { version = "1", features = ["test-util"] }
# `default-features = false` drops `rayon` (parallel sample collection)
# — keeps the dep graph closer to the runtime crate. `async_tokio`
# enables `AsyncBencher::to_async(&runtime).iter(|| async {...})` so
# `tool_latency` can drive wiremock-backed tool dispatch.
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }
# `tower::ServiceExt::oneshot` drives the bearer-auth middleware tests
# without spinning up a real listener. `tower` is already a transitive
# dep of axum; the dev-dep just exposes its trait extension methods.
tower = { version = "0.5", default-features = false, features = ["util"] }

# ── Benchmarks ────────────────────────────────────────────────────────────────
# `harness = false` lets criterion provide its own harness — the default
# `#[test]` harness doesn't understand criterion's CLI flags.

[[bench]]
name = "mime_parsing"
harness = false

[[bench]]
name = "tool_latency"
harness = false
