[package]
name = "google-personal-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "An MCP server exposing personal-data Google services (Gmail first; Calendar, Contacts, etc. to follow)"
license = "MIT"
repository = "https://github.com/torsday/google-personal-mcp"
readme = "README.md"
keywords = ["mcp", "gmail", "google", "oauth2"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "google-personal-mcp"
path = "src/main.rs"

# ── Lints ─────────────────────────────────────────────────────────────────────
# See docs/adr/0005-error-model.md (disallowed methods) and
# docs/adr/0007-testing-strategy.md (panic/unwrap/expect policy in production).

[lints.rust]
# Groups must have priority < individual lints, so individual overrides win.
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Pedantic allow-list — these fire too often or are stylistic-only
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"  # transitive deps; managed via deny.toml warn
similar_names = "allow"

# Things we DO want stricter than default
disallowed_methods = "deny"        # config in clippy.toml
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "deny"

# Allows that resolve direct conflicts between other lints we want on:
# `unreachable_pub` (rust group) recommends `pub(crate)` on items inside private modules,
# while `redundant_pub_crate` (clippy nursery) says the same `pub(crate)` is redundant.
# Pick the explicit-marking convention: keep `unreachable_pub` strict, allow this.
redundant_pub_crate = "allow"

[dependencies]
# MCP
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "schemars"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# HTTP client
reqwest = { version = "0.13", features = ["json", "charset", "http2"] }

# OAuth2
oauth2 = { version = "5" }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
base64 = "0.22"
dirs = "6"
open = "5"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
