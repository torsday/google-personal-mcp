# Clippy configuration
# Most lint settings live in [lints.clippy] in Cargo.toml; this file is for
# settings that aren't expressible as plain lint levels.

# Forbid response-body-discarding patterns. ADR-0005 mandates capturing the
# response body BEFORE checking status so Google's error messages aren't lost.
disallowed-methods = [
    { path = "reqwest::Response::error_for_status", reason = "Discards the response body that contains Google's actual error reason. Use the `let status = resp.status(); let body = resp.text().await?; if !status.is_success() { ... }` pattern per ADR-0005." },
    # Note: the `blocking` variant is intentionally excluded — we don't pull in
    # `reqwest`'s blocking feature, so that path isn't reachable and clippy
    # warns about an unreachable disallow.
]

# Forbid expect/unwrap/panic in production code paths. They're allowed in
# tests via #[allow] at the test-module level.
# (These are also enforced via [lints.clippy] in Cargo.toml.)

# Cognitive complexity threshold — default is 25; tighten slightly.
cognitive-complexity-threshold = 20
