# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# ── Security advisories (RustSec DB) ──────────────────────────────────────────
[advisories]
version = 2
yanked = "deny"
ignore = []

# ── License allowlist ─────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",                 # weak copyleft, OK for linking
    "CC0-1.0",
    "CDLA-Permissive-2.0",     # webpki-roots ships CA cert data under this; permissive data license
]
confidence-threshold = 0.8

# ── Crate bans / duplicate version policy ─────────────────────────────────────
[bans]
multiple-versions = "warn"   # transitive deps often pull duplicates; tighten case-by-case
wildcards = "deny"           # forbid `foo = "*"` deps
highlight = "all"
deny = []
skip = []
skip-tree = []

# ── Source restriction ────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
